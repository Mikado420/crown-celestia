<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a190e">
  <title>酒場のツケ｜クラウン・セレスティア</title>
  <meta name="description" content="天空の王国セレスティアの酒場で遊ぶ、2〜6人の同時出しカードゲーム。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yomogi&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="grove.css">
  <link rel="stylesheet" href="duel.css">
</head>
<body>
  <div class="ambience" aria-hidden="true">
    <div class="lantern l"><span class="cord"></span><span class="lamp"></span></div>
    <div class="lantern r"><span class="cord"></span><span class="lamp"></span></div>
    <div class="firelight"></div>
    <div class="motes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="rules" class="sheet">
    <h2>酒場のツケの遊び方</h2>
    <ol>
      <li>全員が同時に、冒険者を1人選んで酒場へ案内します。</li>
      <li>数字の小さい冒険者から順に、自分より小さく一番近い数字が端にいる卓へ座ります。</li>
      <li>1卓に座れるのは5人まで。<b>6人目</b>は5人分の勘定をツケで払い、その卓に1人で座り直します。</li>
      <li>どの卓の端よりも小さい冒険者は<b>相席お断り</b>。好きな卓を選んで勘定を肩代わりします。</li>
    </ol>
    <p>カード下の硬貨がツケの額です。ジョッキの印が付いた「大酒飲み」はツケ5。10手番で1晩、3晩（2人なら4晩）でツケが一番少ない人の勝ちです。</p>
    <form method="dialog"><button class="btn wide">閉じる</button></form>
  </dialog>

  <dialog id="menu" class="sheet">
    <h2>メニュー</h2>
    <div class="menu-list">
      <button class="btn ghost wide" data-menu="rules">遊び方</button>
      <button class="btn ghost wide" data-menu="sound">効果音：オン</button>
      <button class="btn danger wide" data-menu="leave">退出する</button>
    </div>
    <form method="dialog"><button class="btn wide">ゲームに戻る</button></form>
  </dialog>

  <dialog id="confirm" class="sheet">
    <h2>退出しますか？</h2>
    <p id="confirmText"></p>
    <div class="row">
      <button class="btn ghost" data-confirm="no">やめる</button>
      <button class="btn danger" data-confirm="yes">退出する</button>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
